services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaprosto
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: zaprosto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaprosto"]
      interval: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zaprosto:${DB_PASSWORD}@db:5432/zaprosto
      APP_ORIGIN: ${APP_ORIGIN}
      TOKEN_SECRET: ${TOKEN_SECRET}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      CLIENT_IP_HEADER: x-real-ip
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  pgdata:
